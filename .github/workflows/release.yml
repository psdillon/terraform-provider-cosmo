name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
      # push the latest tag to the remote
      - id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The fork releases from its `release` branch rather than `main`.
          release_branches: release
      # refetch the repo to make sure we have the latest tag
      - uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5.0.2
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6.1.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      # Installed through the Go module proxy: goreleaser-action's download from
      # GitHub release assets kept failing with HTTP 504 on the runners.
      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.20.0
      - name: Run GoReleaser
        run: "$(go env GOPATH)/bin/goreleaser" release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      # Remove the tag (and any partial release) so a failed run can simply be retried.
      - name: Remove tag after failed release
        if: failure() && steps.tag_version.outputs.new_tag != ''
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || git push origin ":refs/tags/$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag_version.outputs.new_tag }}
